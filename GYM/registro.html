
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Lunas Gym</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-cuenta">

    <header class="header-cuenta">
        <a href="index.html" class="logo-cuenta">
            LUNAS GYM
        </a>
    </header>

    <main class="contenedor-cuenta">

        <div class="tarjeta-cuenta">

            <h1>Crear cuenta</h1>

            <div class="linea-cuenta"></div>

            <p class="texto-cuenta">
                Crea tu cuenta para comenzar a formar parte
                de Lunas Gym.
            </p>

            <form id="formRegistro">

                <div class="campo">
                    <label for="nombre">Nombre completo</label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre"
                        autocomplete="name"
                        required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="441 123 4567"
                        autocomplete="tel"
                        required>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Mínimo 8 caracteres"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <div class="campo">
                    <label for="confirmar">Confirmar contraseña</label>

                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="Repite tu contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <label class="terminos">

                    <input
                        type="checkbox"
                        id="terminos"
                        required>

                    <span>
                        Acepto los términos y condiciones
                        de Lunas Gym.
                    </span>

                </label>

                <p
                    id="mensajeRegistro"
                    role="alert"
                    aria-live="polite"
                    style="display:none; color:#ff7777; margin:15px 0;">
                </p>

                <button type="submit" class="boton-cuenta">
                    Crear cuenta
                </button>

            </form>

            <div class="separador-cuenta"></div>

            <p class="cambiar-cuenta">
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>

        </div>

    </main>

    <footer class="footer-cuenta">
        <p>© 2026 Lunas Gym. Todos los derechos reservados.</p>
    </footer>

    <script src="js/registro.js"></script>

</body>

</html>

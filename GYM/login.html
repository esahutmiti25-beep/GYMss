
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Lunas Gym</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-cuenta">

    <header class="header-cuenta">
        <a href="index.html" class="logo-cuenta">
            LUNAS GYM
        </a>
    </header>

    <main class="contenedor-cuenta">

        <div class="tarjeta-cuenta">

            <h1>Iniciar sesión</h1>

            <div class="linea-cuenta"></div>

            <p class="texto-cuenta">
                Ingresa a tu cuenta para administrar tu membresía,
                entrenamientos y progreso.
            </p>

            <form id="formLogin">

                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required>

                </div>

                <div class="campo">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required>

                </div>

                <a href="#" class="olvide-contrasena" id="recuperarContrasena">
                    ¿Olvidaste tu contraseña?
                </a>

                <p
                    id="mensajeLogin"
                    role="alert"
                    aria-live="polite"
                    style="display:none; color:#ff7777; margin:15px 0;">
                </p>

                <button type="submit" class="boton-cuenta">
                    Iniciar sesión
                </button>

            </form>

            <div class="separador-cuenta"></div>

            <p class="cambiar-cuenta">
                ¿Todavía no tienes una cuenta?
                <a href="registro.html">Regístrate</a>
            </p>

        </div>

    </main>

    <footer class="footer-cuenta">
        <p>© 2026 Lunas Gym. Todos los derechos reservados.</p>
    </footer>

    <script src="js/login.js"></script>

</body>

</html>
